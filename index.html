        <h1>ЧистоЛист — приватный офисный комбайн без облака</h1>
        <p>
          Бесплатный сервис для работы с таблицами, документами, фотографиями и текстом полностью
          внутри браузера. Файлы никуда не загружаются.

          <li><strong>PDF:</strong> необратимое замазывание паспортных данных и подписей, водяные знаки, склейка и удаление страниц.</li>
          <li><strong>Фото и сканы:</strong> просмотр и удаление EXIF/GPS, сжатие, сборка изображений в PDF.</li>
          <li><strong>Анонимайзер текста:</strong> замена персональных данных на заглушки перед отправкой в ИИ и возврат обратно.</li>
          <li><strong>Сравнение редакций:</strong> подсветка отличий между двумя версиями договора или текста.</li>
        </ul>
        <p>Для работы инструментов включите JavaScript в браузере.</p>
